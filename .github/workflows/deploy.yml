
name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx quartz plugin install

      - name: Importar notas de Obsidian
        run: |
          git clone --depth 1 https://github.com/ctp-destefano/CTP-Vault.git /tmp/ctp-vault
          mkdir -p content
          find content -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a /tmp/ctp-vault/. content/
          rm -rf content/.git
          find content -name '.obsidian' -type d -prune -exec rm -rf -- {} +

      - run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
