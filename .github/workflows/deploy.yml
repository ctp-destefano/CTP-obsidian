
name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Import Obsidian notes
        run: |
          git clone --depth 1 https://github.com/ctp-destefano/CTP-Vault.git /tmp/ctp-vault
          mkdir -p content
          find content -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a /tmp/ctp-vault/. content/
          rm -rf content/.git
          find content -type d -name '.obsidian' -prune -exec rm -rf -- {} +
          find content -type d -name '.trash' -prune -exec rm -rf -- {} +

      - name: Build Quartz
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
